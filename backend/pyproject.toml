[project]
name = "uit-ecommerce-chatbot"
version = "0.1.0"
description = "E-commerce support chatbot: product consultation, policy Q&A, and order tracking"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "anthropic>=1.4",
    "pymongo>=4.18",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "faker>=40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
