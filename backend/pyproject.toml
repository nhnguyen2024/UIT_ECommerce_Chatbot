[project]
name = "uit-ecommerce-chatbot"
version = "0.1.0"
description = "E-commerce support chatbot: product consultation, policy Q&A, and order tracking"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "anthropic>=1.4",
    "openai>=3.16",
    "pymongo>=4.18",
    "certifi>=2024.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "faker>=40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

# The policy documents and the system prompt are data, not code, so setuptools
# does not pick them up from the package tree on its own. Without these lines an
# installed copy of the package has no policy corpus and no system prompt: the
# seed loader finds nothing to index and the agent fails at import. That failure
# only appears in a built image, never when running from a source checkout, so
# it is worth being explicit about here.
[tool.setuptools.package-data]
seed = ["policies/*.md"]
"app.agent.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
